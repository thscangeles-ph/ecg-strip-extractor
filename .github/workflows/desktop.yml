name: Desktop app

# Builds the installable desktop app on Windows, macOS and Linux.
# Every run uploads the installers as workflow artifacts. Pushing a tag like v1.0.0, or running the workflow
# by hand with a release tag, also publishes a GitHub release (a hand-run creates the tag on the commit it built).
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'electron/**'
      - 'dist/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac
          - os: ubuntu-latest
            name: linux
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # The app is not code-signed; stop electron-builder looking for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ECG-Strip-Extractor-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$v" ]; then echo "::error::Tag $TAG does not match package.json version $v"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ECG Strip Extractor ${{ env.TAG }}
          files: installers/*
          generate_release_notes: true
